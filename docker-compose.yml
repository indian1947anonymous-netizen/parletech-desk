version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: parletech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parletech_desk
      POSTGRES_USER: parletech
      POSTGRES_PASSWORD: parletech123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parletech -d parletech_desk"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parletech_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://parletech:parletech123@postgres:5432/parletech_desk
      AUTH_SECRET: ${AUTH_SECRET:-parletech-secret-change-in-prod}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-ParleTech Desk <support@parletech.com>}
      UPLOAD_DIR: /app/uploads
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: ParleTech Desk
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
  uploads_data:
