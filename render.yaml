services:
  - type: web
    name: parletech-desk
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parletech-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: Indian1947anonymous@gmail.com
      - key: SMTP_PASSWORD
        value: uulqzjqhfzugvunk
      - key: SMTP_FROM
        value: "ParleTech Desk <Indian1947anonymous@gmail.com>"
      - key: GMAIL_EMAIL
        value: Indian1947anonymous@gmail.com
      - key: GMAIL_APP_PASSWORD
        value: uulqzjqhfzugvunk

databases:
  - name: parletech-db
    plan: free
    databaseName: parletech_desk
    user: parletech
